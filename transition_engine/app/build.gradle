 */

plugins {
    id 'groovy'
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    // testImplementation libs.junit.jupiter

    // testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    // implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'transition_engine.TransitionEngineMain'
}

// tasks.named('test') {
//     // Use JUnit Platform for unit tests.
//     useJUnitPlatform()
// }
// Disables test execution tasks
tasks.withType(Test) {
    enabled = false
}

// Disables test compilation tasks to ignore leftover Java/Kotlin test files
tasks.withType(JavaCompile) {
    if (name.contains("Test")) {
        enabled = false
    }
}

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    standardInput = System.in
    
    // FORCES THE JVM RUNTIME NETWORK STACK TO USE INTERFACES LIKE 127.0.0.1
    systemProperty 'java.net.preferIPv4Stack', 'true'
    
    // Forces Gradle to invalidate its build memory caches when changes are saved
    outputs.upToDateWhen { false }
}

jar {
    archiveFileName = 'app.jar'
    manifest {
        attributes(
            'Main-Class': 'transition_engine.TransitionEngineMain'
        )
    }
}
