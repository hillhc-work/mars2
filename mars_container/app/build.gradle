 */

plugins {
    id 'groovy'
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    // testImplementation libs.junit.jupiter

    // testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    // implementation libs.guava
    implementation 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'mars_container.MarsContainerMain'
}

test {
    enabled = false
}

// Disables both the execution and the compilation of tests
tasks.withType(Test) {
    enabled = false
}

tasks.withType(JavaCompile) {
    if (name.contains("Test")) {
        enabled = false
    }
}
// tasks.named('test') {
//     // Use JUnit Platform for unit tests.
//     useJUnitPlatform()
// }

// FIXED: Packages dependencies and sets the required Main-Class manifest
jar {
    archiveFileName = 'app.jar' // Forces the output to be exactly app.jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes('Main-Class': 'mars_container.MarsContainerMain')
    }
    
    // This loops through your dependencies and merges them into the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Allows passing dynamic command-line arguments straight into MarsContainerMain
run {
    if (project.hasProperty('containerPort')) {
        args = [project.property('containerPort')]
    } else {
        args = ['12346'] // Default fallback port if none is provided
    }
}
