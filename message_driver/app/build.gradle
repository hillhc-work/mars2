plugins {
    id 'groovy'
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    // testImplementation libs.junit.jupiter

    // testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    // implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'message_driver.MessageDriverMain'
}

// tasks.named('test') {
//     // Use JUnit Platform for unit tests.
//     useJUnitPlatform()
// }

// Disables the execution of all test tasks
tasks.withType(Test) {
    enabled = false
}

// Disables the compilation of all test source files
tasks.withType(JavaCompile) {
    if (name.contains("Test") || name.contains("test")) {
        enabled = false
    }
}

task runFileMode(type: JavaExec) {
    group = 'application'
    description = 'Executes the message driver directly in local file generation mode.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'message_driver.MessageDriverMain'
    args = ['--file-mode'] // Forces the argument straight into your main method
}

jar {
    archiveFileName = 'app.jar'
    manifest {
        attributes(
            'Main-Class': 'message_driver.MessageDriverMain'
        )
    }
}
